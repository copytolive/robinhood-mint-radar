name: Radar CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q radar
      - name: Static safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MANUAL_ONLY' radar/scanner.py
          grep -Fq 'never signs or sends a transaction' README.md
          grep -Fq 'private key or seed phrase' README.md
          python - <<'PY'
          import json
          d=json.load(open('public/status.json'))
          assert d.get('wallet_execution')=='MANUAL_ONLY'
          assert d.get('money_readiness') in (
              'WAIT FOR QUALIFIED OPPORTUNITY',
              'CATCHING UP — WAIT FOR LIVE TIP',
              'QUALIFIED OPPORTUNITY AVAILABLE',
          )
          if d.get('live_ready')!='READY':
              assert d.get('manual_packages')==[]
              assert int((d.get('scan') or {}).get('qualified_candidates') or 0)==0
          PY
