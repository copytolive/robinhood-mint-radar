name: Continuous Public Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/status.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: robinhood-mint-radar-live-status
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove read-only RPC failover path
        run: |
          python - <<'PY'
          from radar import config
          from radar.rpc import RPCClient
          assert config.RPC_FALLBACK_URLS, 'no read-only fallback RPCs configured'
          c=RPCClient(
              'https://127.0.0.1:1',
              timeout=4,
              retries=0,
              fallback_urls=config.RPC_FALLBACK_URLS,
              expected_chain_id=config.CHAIN_ID,
          )
          chain=c.chain_id(); block=c.block_number()
          assert chain==4663 and block>0
          print({'chain_id':chain,'block':block,'active_rpc':c.url,'failovers':c.failovers})
          PY
      - name: Scan latest Robinhood blocks through watchdog
        shell: bash
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          set -euo pipefail
          rm -f /tmp/radar-public.sqlite /tmp/radar-public.sqlite-wal /tmp/radar-public.sqlite-shm public/status.json
          python -m radar.supervisor \
            --db /tmp/radar-public.sqlite \
            --status public/status.json \
            --interval 1 \
            --cycle-timeout 90 \
            >/tmp/radar-public.out 2>/tmp/radar-public.err &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 200); do
            if [ -f public/status.json ] && python - <<'PY'
          import json
          try:
              d=json.load(open('public/status.json'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if d.get('live_ready')=='READY' and d.get('wallet_execution')=='MANUAL_ONLY' else 1)
          PY
            then
              ok=1
              break
            fi
            sleep 1
          done
          cleanup
          trap - EXIT
          echo '--- supervisor stderr ---'
          cat /tmp/radar-public.err || true
          echo '--- scanner stdout ---'
          cat /tmp/radar-public.out || true
          [ "$ok" -eq 1 ] || { echo 'PUBLIC_SNAPSHOT_READY=FAILED' >&2; exit 1; }
          echo 'PUBLIC_SNAPSHOT_READY=PASS'
      - name: Validate snapshot contract and freshness
        run: |
          python - <<'PY'
          import json
          d=json.load(open('public/status.json'))
          s=d.get('scan',{})
          assert d['mode']=='READ_ONLY'
          assert d['wallet_execution']=='MANUAL_ONLY'
          assert d['live_ready']=='READY', d.get('diagnostics')
          assert int(s.get('lag_blocks',10**9)) <= 2000
          assert int(s.get('lag_seconds',10**9)) <= 60
          assert float(s.get('analysis_age_seconds',10**9)) <= 60
          assert float(s.get('duration_seconds',10**9)) <= 90
          assert not any(c.get('qualified') for c in (d.get('watchlist') or []) if c.get('action')!='MANUAL_MINT_CANDIDATE')
          print({
            'latest_block':d.get('chain',{}).get('latest_block'),
            'live_ready':d['live_ready'],
            'lag_blocks':s.get('lag_blocks'),
            'lag_seconds':s.get('lag_seconds'),
            'analysis_age_seconds':s.get('analysis_age_seconds'),
            'duration_seconds':s.get('duration_seconds'),
            'analysis_rows_considered':s.get('analysis_rows_considered'),
            'analysis_rows_pruned':s.get('analysis_rows_pruned'),
            'qualification_queue_overflow':s.get('qualification_queue_overflow'),
            'qualified':s.get('qualified_candidates')
          })
          PY
      - name: Persist public snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          STATUS_TMP="$(mktemp)"
          cp public/status.json "$STATUS_TMP"
          trap 'rm -f "$STATUS_TMP"' EXIT

          for attempt in 1 2 3; do
            echo "Snapshot persist attempt $attempt/3..."
            git fetch origin main
            git reset --hard origin/main
            cp "$STATUS_TMP" public/status.json
            git add public/status.json
            if git diff --cached --quiet; then
              echo 'No status change to commit'
              exit 0
            fi
            git commit -m 'chore: refresh live Robinhood snapshot [skip ci]'
            if git push origin HEAD:main; then
              echo 'SNAPSHOT_PERSIST=PASS'
              exit 0
            fi
            echo '[RETRY] main advanced during snapshot persist; rebasing generated status onto latest main...'
            sleep "$attempt"
          done
          echo 'SNAPSHOT_PERSIST=FAILED after 3 race-safe attempts' >&2
          exit 1
