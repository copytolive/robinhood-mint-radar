name: MacBook Smoke
on:
  push:
    branches: [main]
    paths-ignore: ['public/status.json']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  macbook:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Shell validation
        shell: bash
        run: |
          set -euo pipefail
          for f in run-local.sh serve-local.sh install-mac.command macos/*.sh; do sh -n "$f"; done
          plutil -lint macos/com.copytolive.robinhood-mint-radar.plist.example
      - name: MacBook live doctor
        run: sh macos/doctor.sh
      - name: One-command installer dry run
        run: RADAR_INSTALL_DRY_RUN=1 sh install-mac.command
      - name: Supervisor live smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/radar-supervisor.sqlite /tmp/radar-supervisor.sqlite-wal /tmp/radar-supervisor.sqlite-shm /tmp/radar-supervisor-status.json
          RADAR_DB=/tmp/radar-supervisor.sqlite \
          RADAR_STATUS_PATH=/tmp/radar-supervisor-status.json \
          RADAR_SCAN_INTERVAL=1 \
          RADAR_CYCLE_TIMEOUT_SECONDS=90 \
          sh run-local.sh >/tmp/radar-supervisor.out 2>/tmp/radar-supervisor.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in {1..120}; do
            if [ -f /tmp/radar-supervisor-status.json ] && python3 - <<'PY'
          import json
          d=json.load(open('/tmp/radar-supervisor-status.json'))
          raise SystemExit(0 if d.get('live_ready')=='READY' and d.get('wallet_execution')=='MANUAL_ONLY' else 1)
          PY
            then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo '--- supervisor stdout ---'; cat /tmp/radar-supervisor.out || true
            echo '--- supervisor stderr ---'; cat /tmp/radar-supervisor.err || true
            exit 1
          fi
          grep -q 'supervisor.*STARTED' /tmp/radar-supervisor.err
          echo 'MAC_SUPERVISOR_SMOKE=PASS'
      - name: Local dashboard smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m radar --once --public-lookback 3 --db /tmp/radar-mac-dashboard.sqlite --status public/status.json --strict
          RADAR_DB=/tmp/radar-mac-dashboard.sqlite python3 -m radar.audit
          sh serve-local.sh >/tmp/radar-dashboard.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS http://127.0.0.1:4173/ >/tmp/radar-index.html; then break; fi; sleep 1; done
          grep -q 'Robinhood Mint Radar' /tmp/radar-index.html
          curl -fsS http://127.0.0.1:4173/status.json | python3 -m json.tool >/dev/null
          echo 'MAC_DASHBOARD_SMOKE=PASS'
